[project]
name = "job-search"
version = "0.1.0"
description = "LinkedIn job scraper and automated resume matcher pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "ddgs>=9.16.0",
    "googlesearch-python>=1.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (unused imports, undefined variables, logic errors)
    "I",     # isort (import sorting and organization)
    "B",     # flake8-bugbear (bugs, design anti-patterns)
    "S",     # flake8-bandit (security issues, request timeouts, regex safety)
    "UP",    # pyupgrade (modern syntax upgrades for Python 3.14+)
    "SIM",   # flake8-simplify (simplifying code structures)
    "PERF",  # Perflint (performance anti-patterns in loops)
    "RUF",   # Ruff-specific rules
    "N",     # pep8-naming (naming conventions)
    "A",     # flake8-builtins (prevent shadowing built-in names)
    "C4",    # flake8-comprehensions (modern list/dict/set comprehensions)
    "RET",   # flake8-return (redundant returns and control flows)
    "ERA",   # eradicate (detecting commented-out dead code)
    "PL",    # Pylint (refactoring, design, and code style rules)
    "TRY",   # tryceratops (exception handling best practices)
    "FURB",  # refurb (modern Python refactoring idioms)
]

ignore = [
    "PLR0911", # Allow multiple return statements in complex classification logic
    "PLR0913", # Allow functions with multiple configuration parameters
    "PLR0917", # Allow multiple positional parameters in helper functions
    "PLR2004", # Allow literal numeric comparisons in thresholds
    "S110",    # Allow silent exception handling in network fallback loops
    "E501",    # Line length warning (handled by formatter or multi-line strings)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
