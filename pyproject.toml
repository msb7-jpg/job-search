[project]
name = "job-search"
version = "0.1.0"
description = "LinkedIn job scraper and automated resume matcher pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "pydantic>=2.13.5",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (unused imports, undefined variables, logic errors)
    "I",     # isort (import sorting and organization)
    "B",     # flake8-bugbear (bugs, design anti-patterns)
    "S",     # flake8-bandit (security issues, request timeouts, regex safety)
    "UP",    # pyupgrade (modern syntax upgrades for Python 3.14+)
    "SIM",   # flake8-simplify (simplifying code structures)
    "PERF",  # Perflint (performance anti-patterns in loops)
    "RUF",   # Ruff-specific rules
    "N",     # pep8-naming (naming conventions)
    "A",     # flake8-builtins (prevent shadowing built-in names)
    "C4",    # flake8-comprehensions (modern list/dict/set comprehensions)
    "RET",   # flake8-return (redundant returns and control flows)
    "ERA",   # eradicate (detecting commented-out dead code)
    "PL",    # Pylint (refactoring, design, and code style rules)
    "TRY",   # tryceratops (exception handling best practices)
    "FURB",  # refurb (modern Python refactoring idioms)
    "C901",  # McCabe cyclomatic complexity
]

ignore = [
    "PLR0911", # Allow multiple return statements in complex classification logic
    "PLR0913", # Allow functions with multiple configuration parameters
    "PLR0917", # Allow multiple positional parameters in helper functions
    "PLR2004", # Allow literal numeric comparisons in thresholds
    "S110",    # Allow silent exception handling in network fallback loops
    "E501",    # Line length warning (handled by formatter or multi-line strings)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "ruff>=0.16.5",
]

[tool.pyright]
pythonVersion = "3.14"
include = ["app", "proxy_pool", "scripts"]
typeCheckingMode = "standard"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["app", "proxy_pool"]

[[tool.importlinter.contracts]]
name = "proxy_pool must stay independent of app"
type = "forbidden"
source_modules = ["proxy_pool"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
name = "app.db must not depend on api or tailor"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.api", "app.tailor"]

[[tool.importlinter.contracts]]
name = "app.providers must not depend on api or tailor"
type = "forbidden"
source_modules = ["app.providers"]
forbidden_modules = ["app.api", "app.tailor"]
